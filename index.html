<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yanagi Academy</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#333333">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff; --ink:#2b2b2b; --btn:#333333; --btn-ink:#ffffff; --mute:#767676; --line:#e4e4e2; --wash:#f3f3f1; --scrim:rgba(30,30,30,.42);
  --display:'Poppins',system-ui,sans-serif;
  --body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1c1c1b; --ink:#ece9e3; --btn:#e8e5de; --btn-ink:#1c1c1b; --mute:#9a9891; --line:#38372f; --wash:#28271f; --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#1c1c1b; --ink:#ece9e3; --btn:#e8e5de; --btn-ink:#1c1c1b; --mute:#9a9891; --line:#38372f; --wash:#28271f; --scrim:rgba(0,0,0,.6);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--paper)}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
svg{display:block}
img{display:block;max-width:100%}
#root{height:100%;max-width:430px;margin:0 auto;position:relative;overflow:hidden;background:var(--paper)}
@media (min-width:431px){#root{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

/* ---------- Home / splash ---------- */
.home{height:100%;display:flex;flex-direction:column}
.scroller{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.hero{padding:22px 24px 14px;text-align:center}
.hero img{margin:0 auto 6px}
.hero .tag{color:var(--mute);font-size:13.5px;margin-top:6px}
.searchbar{margin:6px 20px 4px;display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;min-height:48px}
.searchbar input{flex:1;min-width:0;border:0;background:none}
.searchbar input:focus{outline:none}
.searchbar svg{width:19px;height:19px;color:var(--mute);flex:none}
.section-h{display:flex;align-items:baseline;justify-content:space-between;padding:20px 20px 8px}
.section-h h2{font-family:var(--display);font-weight:700;font-size:15.5px;margin:0;letter-spacing:.01em}
.section-h button{color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.cat{border:1.5px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:24px;min-height:92px}
.cat:active{border-color:var(--btn)}
.cat .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.cat .ic svg{width:17px;height:17px;color:#fff}
.cat b{font-family:var(--display);font-weight:600;font-size:14px;line-height:1.25}
.cat span{color:var(--mute);font-size:12px}
.hrow{display:flex;gap:10px;padding:0 16px;overflow-x:auto}
.hrow::-webkit-scrollbar{display:none}
.pcard{flex:0 0 auto;width:210px;border:1.5px solid var(--line);border-radius:16px;padding:13px}
.pcard:active{border-color:var(--btn)}
.pcard .tag2{display:inline-block;font-size:11px;color:#fff;padding:3px 9px;border-radius:999px;margin-bottom:8px}
.pcard b{display:block;font-size:14.5px;line-height:1.3;margin-bottom:3px}
.pcard span{color:var(--mute);font-size:12.5px}
.empty-fav{margin:0 16px;padding:16px;border:1.5px dashed var(--line);border-radius:14px;color:var(--mute);font-size:13.5px}
.bottom{display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bottom button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0 10px;color:var(--mute)}
.bottom button.on{color:var(--btn)}
.bottom svg{width:22px;height:22px}
.bottom span{font-size:11px;font-weight:500}

/* ---------- Top bar (schermate interne) ---------- */
.top{display:flex;align-items:center;gap:4px;padding:8px 8px;border-bottom:1px solid var(--line);min-height:56px}
.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;flex:none}
.icon:active{background:var(--wash)}
.icon svg{width:22px;height:22px}
.ttl{flex:1;min-width:0;text-align:center}
.ttl b{display:block;font-family:var(--display);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.ttl span{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.screen{height:100%;display:flex;flex-direction:column}

/* ---------- Filtri ---------- */
.filters{display:flex;gap:8px;padding:10px 14px;overflow-x:auto;border-bottom:1px solid var(--line)}
.filters::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13.5px;min-height:38px;display:flex;align-items:center;gap:6px}
.chip.on{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}

/* ---------- Liste schede ---------- */
.list{flex:1;overflow-y:auto;padding:10px 14px}
.row-card{display:flex;gap:12px;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line)}
.row-card:active{background:var(--wash)}
.row-card .dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:5px}
.row-card .b{flex:1;min-width:0}
.row-card b{display:block;font-size:15px;font-weight:700;line-height:1.3}
.row-card .meta{color:var(--mute);font-size:12.5px;margin-top:2px}
.row-card .lv{font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:7px;padding:2px 7px;flex:none;white-space:nowrap}
.noresult{margin:40px 20px;text-align:center;color:var(--mute)}

/* ---------- Dettaglio scheda ---------- */
.detail{flex:1;overflow-y:auto}
.dhead{padding:20px 20px 14px;border-bottom:1px solid var(--line)}
.dhead .tag2{display:inline-block;font-size:11.5px;color:#fff;padding:4px 11px;border-radius:999px;margin-bottom:10px}
.dhead h1{font-family:var(--display);font-weight:700;font-size:22px;margin:0 0 6px;line-height:1.25}
.dhead .lv2{color:var(--mute);font-size:13px}
.dbody{padding:18px 20px 40px}
.dbody h3{font-family:var(--display);font-weight:700;font-size:13.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin:22px 0 10px}
.dbody h3:first-child{margin-top:0}
.dbody p{margin:0 0 10px;font-size:15.5px}
.dbody ul{margin:0;padding-left:20px}
.dbody li{margin-bottom:9px;font-size:15px}
.note-box{background:var(--wash);border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--mute);margin-top:4px}
.rel{display:flex;gap:8px;overflow-x:auto;margin-top:2px}
.rel::-webkit-scrollbar{display:none}
.relcard{flex:0 0 auto;width:170px;border:1.5px solid var(--line);border-radius:13px;padding:11px}
.relcard b{display:block;font-size:13.5px;margin-bottom:2px}
.relcard span{color:var(--mute);font-size:11.5px}
.dactions{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:10px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
.btn{flex:1;min-height:50px;border-radius:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--btn)}
.btn.solid{background:var(--btn);color:var(--btn-ink)}
.btn.ghost{background:var(--paper);color:var(--btn)}
.btn svg{width:18px;height:18px}
.btn.saved{background:var(--wash);color:var(--btn);border-color:var(--line)}

/* ---------- Preferiti / cartelle ---------- */
.folderlist{padding:10px 14px}
.settings{flex:1;overflow-y:auto;padding:6px 16px 24px}
.set-h{font-family:var(--display);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin:22px 4px 10px}
.set-h:first-child{margin-top:16px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;min-height:42px;border-radius:10px;font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:center}
.seg button.on{background:var(--btn);color:var(--btn-ink)}
.set-row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line)}
.set-row .t{flex:1;min-width:0}
.set-row b{display:block;font-size:15px;font-weight:600}
.set-row span{color:var(--mute);font-size:12.5px}
.set-row:active{background:var(--wash)}
.toast{position:absolute;left:50%;bottom:78px;transform:translate(-50%,10px);background:var(--btn);color:var(--btn-ink);padding:10px 16px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;z-index:40;max-width:86%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.frow{display:flex;align-items:center;gap:12px;padding:13px 6px;border-bottom:1px solid var(--line)}
.frow .dot{width:14px;height:14px;border-radius:5px;flex:none;border:1.5px solid var(--btn)}
.frow b{flex:1;font-size:15px;font-weight:600}
.frow .ct{color:var(--mute);font-size:13px}
.fab{margin:12px 16px}

/* ---------- Sheet ---------- */
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.open{opacity:1;pointer-events:auto}
.sheetwrap{position:absolute;inset:0;z-index:30;display:flex;align-items:flex-end}
.sheetwrap .bg{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;width:100%;background:var(--paper);border-top:1.5px solid var(--btn);border-radius:22px 22px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:80%;overflow-y:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-family:var(--display);font-weight:700;font-size:19px;margin:4px 0 14px}
.lbl{font-size:13.5px;color:var(--mute);margin:14px 0 6px;display:block}
.field{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;background:var(--paper)}
.field:focus{outline:none;border-color:var(--btn)}
.sw{display:flex;gap:12px;flex-wrap:wrap}
.sw button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);display:grid;place-items:center}
.sw button.on{border-color:var(--btn);box-shadow:inset 0 0 0 3px var(--paper)}
.sw button i{width:100%;height:100%;border-radius:10px;display:block}
.acts{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.danger{color:#b3261e;border-color:#b3261e}
.pickrow{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:8px 6px}
.pickrow.on{background:var(--wash);border-radius:10px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  note:'Variante di scuola',rel:['p1']},
 {id:'st1',cat:'strategia',level:'Avanzato',title:'Gestione del golden score',meta:'Tattica di gara',
  intro:'Nel tempo supplementare vince il primo punteggio: cambia il modo di rischiare.',

  errors:[],note:'Principio consolidato',rel:['st2']},
 {id:'st2',cat:'strategia',level:'Base',title:'Affrontare un avversario più alto',meta:'Tattica generale',
  intro:'La differenza di leva cambia l’efficacia di alcune tecniche: conviene adattare distanza e presa.',
  points:['Lavora più vicino, riduci la sua leva','Cerca le proiezioni di sacrificio, meno legate all’altezza','Occhio ai suoi tentativi di controllo dall’alto'],

 {id:'r1',cat:'regolamento',level:'Base',title:'Punteggi: ippon e waza-ari',meta:'Regolamento IJF',

  points:['Ippon: chiude subito l’incontro','Due waza-ari equivalgono a un ippon','Il criterio guarda forza, controllo e velocità della caduta'],
  errors:[],note:'Aggiornato al regolamento in vigore: verifica sempre l’ultima versione IJF',rel:[]},
 {id:'gl1',cat:'glossario',level:'Base',title:'Kuzushi',meta:'Squilibrio',
  intro:'Lo squilibrio dell’avversario, il primo dei tre tempi di una proiezione (kuzushi, tsukuri, kake).',
  points:[],errors:[],note:'',rel:['n1']},
 {id:'l1',cat:'libri',level:'Intermedio',title:'Kodokan Judo',meta:'Jigoro Kano · Giapponese/Inglese',
  intro:'Il testo scritto dal fondatore del judo, con i principi e le tecniche fondamentali codificate al Kodokan.',
  points:[],errors:[],note:'',rel:[]},
 {id:'d1',cat:'documenti',level:'Base',title:'Regolamento arbitrale IJF',meta:'International Judo Federation',
  intro:'Il documento ufficiale con le regole di gara aggiornate, pubblicato dalla federazione internazionale.',
  points:[],errors:[],note:'',rel:['r1']},
];
const card=id=>CARDS.find(c=>c.id===id);

/* ---------- Stato ---------- */
const S={screen:'home',tab:'home',view:null,detail:null,sheet:null,q:'',fcat:null,flevel:null,
 folders:[{id:'f1',name:'Da rivedere',color:'#333333'},{id:'f2',name:'Per gli allievi',color:'#2f7d4f'}],
 saved:{p1:'f1',n1:null}, // id scheda -> id cartella (null = salvata senza cartella)
 pendingSave:null,
 theme:(()=>{try{return localStorage.getItem('yanagi_theme')||'sistema'}catch(e){return 'sistema'}})()};
let _id=10;const nid=()=>'f'+(_id++);
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&lt;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){
 let el=document.querySelector('#toast');
 if(!el){el=document.createElement('div');el.id='toast';el.className='toast';document.querySelector('#root').appendChild(el)}
 el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),2600);
}

function applyTheme(){
 const t=S.theme;
 if(t==='chiaro')document.documentElement.setAttribute('data-theme','light');
 else if(t==='scuro')document.documentElement.setAttribute('data-theme','dark');
 else document.documentElement.removeAttribute('data-theme');
}
applyTheme();

function norm(s){
 return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/[-_]/g,' ').replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,' ').trim();
}
function matches(c,q){
 if(!q)return true;
 const tokens=norm(q).split(' ').filter(Boolean);
 if(!tokens.length)return true;
 const hay=norm(c.title+' '+c.meta+' '+cat(c.cat).name);
 return tokens.every(t=>hay.includes(t));
}
function filtered(){
 return CARDS.filter(c=>matches(c,S.q)&&(!S.fcat||c.cat===S.fcat)&&(!S.flevel||c.level===S.flevel));
}

/* ---------- Home ---------- */
function homeScreen(){
 const recent=CARDS.slice(0,4);
 return `<div class="home">
  <div class="scroller">
   <div class="hero"><img src="${LOCKUP_URI}" alt="Yanagi Academy" width="150"><div class="tag">Judo · schede tecniche e tattica</div></div>
   <button class="searchbar" data-a="tosearch">${I.search}<span style="color:var(--mute)">Cerca una tecnica, una posizione…</span></button>
   <div class="section-h"><h2>Categorie</h2></div>
   <div class="grid">${CATS.map(c=>`<button class="cat" data-a="opencat" data-id="${c.id}"><span class="ic" style="background:${c.color}">${c.icon}</span><b>${esc(c.name)}</b></button>`).join('')}</div>
   <div class="section-h"><h2>Da riprendere</h2></div>
   <div class="hrow">${recent.map(pcard).join('')}</div>
   <div style="height:18px"></div>
  </div>
  ${bottomNav('home')}
 </div>`}
function pcard(c){const k=cat(c.cat);return `<button class="pcard" data-a="opencard" data-id="${c.id}"><span class="tag2" style="background:${k.color}">${esc(k.name)}</span><b>${esc(c.title)}</b><span>${esc(c.meta)}</span></button>`}
function bottomNav(active){
 const it=(id,icon,label)=>`<button class="${active===id?'on':''}" data-a="tab" data-id="${id}">${icon}<span>${label}</span></button>`;
 return `<nav class="bottom">${it('home',I.home,'Home')}${it('categorie',I.grid,'Categorie')}${it('preferiti',I.star,'Preferiti')}${it('impostazioni',I.gear,'Impostazioni')}</nav>`}

/* ---------- Categoria ---------- */
function catsScreen(){
 return `<div class="screen">
  <div class="top"><span class="icon"></span><div class="ttl"><b>Categorie</b></div><span class="icon"></span></div>
  <div class="list"><div class="grid" style="padding:6px 0">${CATS.map(c=>`<button class="cat" data-a="opencat" data-id="${c.id}"><span class="ic" style="background:${c.color}">${c.icon}</span><b>${esc(c.name)}</b></button>`).join('')}</div></div>
  ${bottomNav('categorie')}
 </div>`}

function catDetailScreen(){
 const c=cat(S.view);
 return `<div class="screen">
  <div class="top"><button class="icon" data-a="back" aria-label="Indietro">${I.back}</button><div class="ttl"><b>${esc(c.name)}</b><span>${esc(c.short)}</span></div><span class="icon"></span></div>
  ${listBody(CARDS.filter(x=>x.cat===c.id))}

/* ---------- Ricerca ---------- */
function searchScreen(){
 return `<div class="screen">
  <div class="top"><button class="icon" data-a="back" aria-label="Indietro">${I.back}</button>
   <div style="flex:1"><input id="sq" class="field" style="min-height:40px" placeholder="Cerca…" value="${esc(S.q)}" autofocus></div>
   <span class="icon"></span></div>
  <div class="filters">
   ${CATS.map(c=>`<button class="chip ${S.fcat===c.id?'on':''}" data-a="fcat" data-id="${c.id}">${esc(c.name)}</button>`).join('')}
  </div>
  <div class="filters" style="border-top:0">
   ${LEVELS.map(l=>`<button class="chip ${S.flevel===l?'on':''}" data-a="flevel" data-id="${l}">${esc(l)}</button>`).join('')}
  </div>
  ${listBody(filtered())}
 </div>`}

function listBody(items){
 if(!items.length)return `<div class="list"><p class="noresult">Nessuna scheda trovata. Prova un’altra parola o togli un filtro.</p></div>`;
 return `<div class="list">${items.map(c=>{
  const k=cat(c.cat);
  return `<button class="row-card" data-a="opencard" data-id="${c.id}"><span class="dot" style="background:${k.color}"></span><span class="b"><b>${esc(c.title)}</b><span class="meta">${esc(k.name)} · ${esc(c.meta)}</span></span><span class="lv">${esc(c.level)}</span></button>`;
 }).join('')}</div>`}

/* ---------- Dettaglio scheda ---------- */
function cardScreen(){
 const c=card(S.detail),k=cat(c.cat);
 const isSaved=c.id in S.saved;
 const rel=(c.rel||[]).map(card).filter(Boolean);
 return `<div class="screen">
  <div class="top"><button class="icon" data-a="back" aria-label="Indietro">${I.back}</button><div class="ttl"><b>${esc(k.name)}</b></div><span class="icon"></span></div>
  <div class="detail">
   <div class="dhead"><span class="tag2" style="background:${k.color}">${esc(k.short)}</span><h1>${esc(c.title)}</h1><div class="lv2">${esc(c.meta)} · Livello ${esc(c.level).toLowerCase()}</div>
    ${c.video?`<a class="btn ghost" style="margin-top:14px;min-height:44px" href="${esc(c.video)}" target="_blank" rel="noopener noreferrer">${I.play}${c.cat==='documenti'?'Apri il documento':'Guarda il video'}</a>`:''}
   </div>
   <div class="dbody">
    <h3>Cos'è</h3><p>${esc(c.intro)}</p>
    ${c.points.length?`<h3>Punti chiave</h3><ul>${c.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`:''}
    ${c.errors.length?`<h3>Errori comuni</h3><ul>${c.errors.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`:''}
    ${c.note?`<h3>Da sapere</h3><div class="note-box">${esc(c.note)}</div>`:''}
    ${rel.length?`<h3>Schede collegate</h3><div class="rel">${rel.map(r=>`<button class="relcard" data-a="opencard" data-id="${r.id}"><b>${esc(r.title)}</b><span>${esc(cat(r.cat).name)}</span></button>`).join('')}</div>`:''}
   </div>
  </div>
  <div class="dactions">
   <button class="btn ${isSaved?'saved':'ghost'}" data-a="togglesave" data-id="${c.id}">${isSaved?I.starFill:I.star}${isSaved?'Salvata':'Salva'}</button>
   ${isSaved?`<button class="btn ghost" data-a="movecard" data-id="${c.id}">${I.folder}Cartella</button>`:''}
  </div>
 </div>`}

/* ---------- Preferiti ---------- */
function favScreen(){
 const savedIds=Object.keys(S.saved);
 return `<div class="screen">
  <div class="top"><span class="icon"></span><div class="ttl"><b>Preferiti</b></div><button class="icon" data-a="newfolder" aria-label="Nuova cartella">${I.plus}</button></div>
  <div class="folderlist">
   ${S.folders.map(f=>{const n=savedIds.filter(id=>S.saved[id]===f.id).length;
    return `<button class="frow" data-a="openfolder" data-id="${f.id}"><span class="dot" style="background:${f.color}"></span><b>${esc(f.name)}</b><span class="ct">${n}</span></button>`}).join('')}
   <button class="frow" data-a="openfolder" data-id="_none"><span class="dot" style="background:var(--paper)"></span><b>Senza cartella</b><span class="ct">${savedIds.filter(id=>!S.saved[id]).length}</span></button>
  </div>
  ${bottomNav('preferiti')}
 </div>`}

function folderViewScreen(){
 const id=S.view;
 const items=Object.keys(S.saved).filter(k=>id==='_none'?!S.saved[k]:S.saved[k]===id).map(card);
 const f=id==='_none'?null:S.folders.find(x=>x.id===id);
 return `<div class="screen">
  <div class="top"><button class="icon" data-a="back" aria-label="Indietro">${I.back}</button><div class="ttl"><b>${f?esc(f.name):'Senza cartella'}</b></div>${f?`<button class="icon" data-a="editfolder" data-id="${f.id}">${I.pen}</button>`:'<span class="icon"></span>'}</div>
  ${items.length?listBody(items):`<div class="list"><p class="noresult">Nessuna scheda salvata qui. Apri una scheda e tocca «Salva».</p></div>`}
 </div>`}

/* ---------- Impostazioni ---------- */
function settingsScreen(){
 const opt=(id,label)=>`<button class="${S.theme===id?'on':''}" data-a="theme" data-id="${id}">${label}</button>`;
 return `<div class="screen">
  <div class="top"><span class="icon"></span><div class="ttl"><b>Impostazioni</b></div><span class="icon"></span></div>
  <div class="settings">
   <div class="set-h">Aspetto</div>
   <div class="seg">${opt('chiaro','Chiaro')}${opt('scuro','Scuro')}${opt('sistema','Sistema')}</div>

   <div class="set-h">Contenuti</div>
   <button class="set-row" data-a="refreshdata"><span class="t"><b>Aggiorna contenuti ora</b><span>Ricontrolla le schede pubblicate</span></span></button>

   <div class="set-h">Informazioni</div>
   <div class="set-row"><span class="t"><b>Yanagi Academy — Judo</b><span>Formato Yanagi Academy · versione app 1.0</span></span></div>
  </div>
  ${bottomNav('impostazioni')}
 </div>`}

/* ---------- Sheet: sposta / nuova cartella ---------- */
const COLORS=['#333333','#b3261e','#1f4e8c','#2f7d4f','#c28a00','#7a4fa0'];
function sheet(){
 const s=S.sheet;if(!s)return'';
 let inner='';
 if(s.type==='move'){
  const cur=S.saved[s.id];
  inner=`<h3>Sposta in cartella</h3>`+
   S.folders.map(f=>`<button class="pickrow ${cur===f.id?'on':''}" data-a="moveto" data-f="${f.id}"><span class="dot" style="background:${f.color}"></span><span style="flex:1">${esc(f.name)}</span></button>`).join('')+
   `<button class="pickrow ${!cur?'on':''}" data-a="moveto" data-f=""><span class="dot" style="background:var(--paper)"></span><span style="flex:1">Nessuna cartella</span></button>
   <div class="acts"><button class="btn ghost small" data-a="closesheet">Chiudi</button></div>`;
 }else if(s.type==='folder'){
  inner=`<h3>${s.id?'Modifica cartella':'Nuova cartella'}</h3>
  <label class="lbl" for="fn">Nome</label><input class="field" id="fn" value="${esc(s.name)}" maxlength="26" placeholder="Es. Per la gara di aprile">
  <span class="lbl">Colore</span><div class="sw">${COLORS.map(c=>`<button class="${c===s.color?'on':''}" data-a="color" data-c="${c}"><i style="background:${c}"></i></button>`).join('')}</div>
  <div class="acts"><button class="btn solid" data-a="savefolder">Salva cartella</button>${s.id?`<button class="btn ghost danger" data-a="delfolder">Elimina cartella</button>`:''}<button class="btn ghost small" data-a="closesheet">Annulla</button></div>`;
 }
 return `<div class="sheetwrap"><div class="bg" data-a="closesheet"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${inner}</div></div>`}

/* ---------- Render + cronologia (per il tasto indietro del telefono) ---------- */
const DEEP=['card','catdetail','search','folder'];
function navKey(){return S.screen+'|'+S.view+'|'+S.detail}
function syncHistory(){
 const key=navKey();
 if(S._popping){S._lastNavKey=key;return}
 if(S._lastNavKey===key)return;
 const first=S._lastNavKey===undefined;
 const state={screen:S.screen,view:S.view,detail:S.detail,tab:S.tab};
 if(!first&&DEEP.includes(S.screen))history.pushState(state,'');
 else history.replaceState(state,'');
 S._lastNavKey=key;
}
window.addEventListener('popstate',e=>{
 S._popping=true;
 const st=e.state;
 if(st){S.screen=st.screen;S.view=st.view;S.detail=st.detail;S.tab=st.tab||S.tab}
 else{S.screen='home';S.tab='home';S.view=null;S.detail=null}
 S.sheet=null;S.drawer=false;
 render();
 S._popping=false;
});

function render(){
 let html;
 if(S.screen==='home')html=homeScreen();
 else if(S.screen==='categorie')html=catsScreen();
 else if(S.screen==='catdetail')html=catDetailScreen();
 else if(S.screen==='search')html=searchScreen();
 else if(S.screen==='card')html=cardScreen();
 else if(S.screen==='preferiti')html=favScreen();
 else if(S.screen==='folder')html=folderViewScreen();
 else if(S.screen==='impostazioni')html=settingsScreen();
 syncHistory();
 $('#root').innerHTML=html+sheet();
 const sq=$('#sq');if(sq){sq.focus();const v=sq.value;sq.value='';sq.value=v}
}

/* ---------- Eventi ---------- */
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');if(!el)return;
 const a=el.dataset.a,d=el.dataset;
 if(a==='tab'){S.tab=d.id;S.screen=d.id;render()}
 else if(a==='tosearch'){S.screen='search';S.q='';S.fcat=null;S.flevel=null;render()}
 else if(a==='opencat'){S.view=d.id;S.screen='catdetail';render()}
 else if(a==='opencard'){S.detail=d.id;S.screen='card';render()}
 else if(a==='back'){history.back()}
 else if(a==='openfolder'){S.view=d.id;S.screen='folder';render()}
 else if(a==='fcat'){S.fcat=S.fcat===d.id?null:d.id;render()}
 else if(a==='flevel'){S.flevel=S.flevel===d.id?null:d.id;render()}
 else if(a==='togglesave'){
  if(d.id in S.saved)delete S.saved[d.id];else S.saved[d.id]=null;
  render();
 }
 else if(a==='movecard'){S.sheet={type:'move',id:d.id};render()}
 else if(a==='moveto'){S.saved[S.sheet.id]=d.f||null;S.sheet=null;render()}
 else if(a==='newfolder'){S.sheet={type:'folder',id:null,name:'',color:COLORS[0]};render()}
 else if(a==='editfolder'){const f=S.folders.find(x=>x.id===d.id);S.sheet={type:'folder',id:f.id,name:f.name,color:f.color};render()}
 else if(a==='color'){const n=$('#fn');if(n)S.sheet.name=n.value;S.sheet.color=d.c;render();$('#fn')?.focus()}
 else if(a==='savefolder'){
  const name=($('#fn').value||'').trim();
  if(!name){$('#fn').focus();$('#fn').placeholder='Dai un nome alla cartella';return}
  if(S.sheet.id){const f=S.folders.find(x=>x.id===S.sheet.id);f.name=name;f.color=S.sheet.color}
  else S.folders.push({id:nid(),name,color:S.sheet.color});
  S.sheet=null;render();
 }
 else if(a==='delfolder'){
  const id=S.sheet.id;
  Object.keys(S.saved).forEach(k=>{if(S.saved[k]===id)S.saved[k]=null});
  S.folders=S.folders.filter(f=>f.id!==id);S.sheet=null;
  if(S.screen==='folder'&&S.view===id)S.screen='preferiti';
  render();
 }
 else if(a==='closesheet'){S.sheet=null;render()}
 else if(a==='theme'){
  S.theme=d.id;try{localStorage.setItem('yanagi_theme',S.theme)}catch(e){}
  applyTheme();render();
 }
 else if(a==='refreshdata'){
  fetch('data.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d2=>{
   if(d2&&Array.isArray(d2.cards)&&d2.cards.length){CARDS=d2.cards;render();toast('Contenuti aggiornati')}
   else toast('Nessun aggiornamento trovato');
  }).catch(()=>toast('Impossibile controllare ora'));
 }
});
document.addEventListener('input',e=>{if(e.target.id==='sq'){S.q=e.target.value;const list=document.querySelector('.list');if(list){const items=filtered();list.outerHTML=listBody(items)}}});
render();

/* Se esiste un data.json accanto a questa pagina (dopo che l'hai pubblicato
   dall'editor), lo carica e sostituisce le schede di esempio, senza dover
   più toccare questo file. */
(function loadRemoteData(){
 fetch('data.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{
  if(d&&Array.isArray(d.cards)&&d.cards.length){
   CARDS=d.cards;
   if(['home','categorie','catdetail','search','preferiti','folder'].includes(S.screen))render();
  }
 }).catch(()=>{});
})();

if('serviceWorker' in navigator){
 window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}
</script>
</body>
