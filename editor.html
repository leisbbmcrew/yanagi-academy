<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yanagi Academy — Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff; --ink:#2b2b2b; --btn:#333333; --mute:#767676; --line:#e4e4e2; --wash:#f3f3f1; --scrim:rgba(30,30,30,.42);
  --display:'Poppins',system-ui,sans-serif;
  --body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
svg{display:block}
img{display:block;max-width:100%}
#root{height:100%;max-width:520px;margin:0 auto;position:relative;overflow:hidden;background:var(--paper)}
@media (min-width:521px){#root{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

.screen{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:4px;padding:8px 8px;border-bottom:1px solid var(--line);min-height:56px}
.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;flex:none}
.icon:active{background:var(--wash)}
.icon svg{width:22px;height:22px}
.ttl{flex:1;min-width:0;text-align:center}
.ttl b{display:block;font-family:var(--display);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.ttl span{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.hero{padding:20px 24px 10px;text-align:center}
.hero img{margin:0 auto 8px}
.hero p{color:var(--mute);font-size:13.5px;margin:0}

.bar{display:flex;gap:8px;padding:10px 14px;align-items:center}
.bar input{flex:1;min-height:44px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;background:var(--paper)}
.bar input:focus{outline:none;border-color:var(--btn)}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--btn);display:grid;place-items:center;flex:none}
.iconbtn svg{width:19px;height:19px}
.iconbtn.solid{background:var(--btn);color:#fff}
.catbar{display:flex;gap:8px;overflow-x:auto;padding:0 14px 10px}
.catbar::-webkit-scrollbar{display:none}

.list{flex:1;overflow-y:auto;padding:4px 14px 90px}
.row{display:flex;gap:12px;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line)}
.row:active{background:var(--wash)}
.row .dot{width:9px;height:9px;border-radius:50%;flex:none}
.row .b{flex:1;min-width:0}
.row b{display:block;font-size:15px;font-weight:700}
.row .meta{color:var(--mute);font-size:12.5px;margin-top:2px}
.row .lv{font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:7px;padding:2px 7px;flex:none}
.empty{margin:40px 20px;text-align:center;color:var(--mute);font-size:14px}

.fabbar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--line)}
.btn{flex:1;min-height:50px;border-radius:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--btn)}
.btn.solid{background:var(--btn);color:#fff}
.btn.ghost{background:var(--paper);color:var(--btn)}
.btn.small{min-height:44px;font-weight:500}
.btn svg{width:18px;height:18px}
.btn.danger{color:#b3261e;border-color:#b3261e}

.form{flex:1;overflow-y:auto;padding:16px 18px 24px}
.lbl{font-size:13px;color:var(--mute);margin:16px 0 6px;display:block}
.lbl:first-child{margin-top:0}
.field{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;background:var(--paper)}
.field:focus{outline:none;border-color:var(--btn)}
textarea.field{min-height:88px;padding:12px 14px;resize:vertical;line-height:1.45}
select.field{appearance:none}
.hint{font-size:12px;color:var(--mute);margin-top:5px}
.row2{display:flex;gap:10px}
.row2>div{flex:1;min-width:0}
.chipset{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px}
.chip.on{background:var(--btn);color:#fff;border-color:var(--btn)}
.formactions{display:flex;gap:10px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}

.preview{margin-top:18px;border:1.5px dashed var(--line);border-radius:14px;padding:14px 16px}
.preview h4{font-family:var(--display);font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin:0 0 10px}
.preview .tag2{display:inline-block;font-size:11px;color:#fff;padding:3px 9px;border-radius:999px;margin-bottom:8px}
.preview h1{font-family:var(--display);font-weight:700;font-size:18px;margin:0 0 4px}
.preview .lv2{color:var(--mute);font-size:12.5px;margin-bottom:10px}
.preview p{margin:0 0 8px;font-size:14px}
.preview ul{margin:4px 0 8px;padding-left:18px}
.preview li{margin-bottom:5px;font-size:13.5px}
.preview .note{background:var(--wash);border-radius:10px;padding:9px 12px;font-size:12.5px;color:var(--mute)}

.sheetwrap{position:absolute;inset:0;z-index:30;display:flex;align-items:flex-end}
.sheetwrap .bg{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;width:100%;background:var(--paper);border-top:1.5px solid var(--btn);border-radius:22px 22px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:82%;overflow-y:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-family:var(--display);font-weight:700;font-size:18px;margin:4px 0 8px}
.sheet p{color:var(--mute);font-size:14px;margin:0 0 16px}
.acts{display:flex;flex-direction:column;gap:10px;margin-top:6px}

.toast{position:absolute;left:50%;bottom:76px;transform:translate(-50%,10px);background:var(--btn);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;z-index:40;max-width:86%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

 {id:'kata',name:'Kata',color:'#7a4fa0'},
 {id:'posizioni',name:'Posizioni',color:'#c28a00'},
 {id:'strategia',name:'Strategia e gara',color:'#333333'},
 {id:'regolamento',name:'Regolamento',color:'#555555'},
 {id:'glossario',name:'Glossario',color:'#3a7d7d'},
 {id:'libri',name:'Libri',color:'#9c5b2e'},
 {id:'documenti',name:'Documenti',color:'#4a5a70'},
];
const LEVELS=['Base','Intermedio','Avanzato'];
const cat=id=>CATS.find(c=>c.id===id)||CATS[0];

/* Schede di partenza: uguali a quelle già online, servono solo se non
   riesce a caricare il data.json pubblicato (es. la prima volta). */
let CARDS=[
 {id:'p1',cat:'prese',level:'Base',title:'Presa alla manica',meta:'Kumi-kata a distanza',
  intro:'La presa più comune per iniziare uno scambio: tieni l’avversario a distanza mantenendo il controllo su una delle sue leve.',
  points:['Mano che ruota leggermente verso l’interno per bloccare il tessuto','Lascia libera l’anca per entrare in proiezione','Utile contro avversari che cercano il corpo a corpo'],
  errors:['Braccio troppo teso: perdi la reattività','Presa troppo alta, vicino alla spalla: facile da liberare'],
  note:'Principio consolidato',video:'',rel:[]},
];

/* ---------- Stato ---------- */
const S={screen:'list',q:'',fcat:null,editing:null,sheet:null,dirty:false,source:'esempio'};
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function slug(t){return (t||'scheda').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'').slice(0,28)}
function uniqueId(base){let id=base||'scheda',n=1;while(CARDS.some(c=>c.id===id)){n++;id=`${base}-${n}`}return id}
function toast(t){let el=$('#toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';document.body.querySelector?document.body.appendChild(el):null}
 el=$('#toast')||(()=>{const e=document.createElement('div');e.id='toast';e.className='toast';document.querySelector('#root').appendChild(e);return e})();
 el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),2600);
}

function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[-_]/g,' ').replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,' ').trim()}
function filtered(){
 const tokens=norm(S.q).split(' ').filter(Boolean);
 const order=CATS.map(x=>x.id);
 return CARDS
  .filter(c=>!S.fcat||c.cat===S.fcat)
  .filter(c=>!tokens.length||tokens.every(t=>norm(c.title+' '+c.meta+' '+cat(c.cat).name).includes(t)))
  .sort((a,b)=>order.indexOf(a.cat)-order.indexOf(b.cat)||(a.title||'').localeCompare(b.title||'','it'));
}
function relChipsHtml(c,q){
 q=norm(q||'');
 const selected=c.rel||[];
 const others=CARDS.filter(x=>x.id!==c.id);
 let list;
 if(q)list=others.filter(x=>selected.includes(x.id)||norm(x.title||'').includes(q)||norm(cat(x.cat).name).includes(q));
 else list=others.filter(x=>selected.includes(x.id));
 if(!list.length)return q?'<span class="hint">Nessuna scheda trovata.</span>':(others.length?'<span class="hint">Digita per cercare altre schede da collegare.</span>':'<span class="hint">Aggiungi altre schede per poterle collegare.</span>');
 return list.map(x=>`<button class="chip ${selected.includes(x.id)?'on':''}" data-a="rel" data-id="${x.id}">${esc(x.title||'(senza titolo)')}</button>`).join('');
}

/* ---------- Schermata elenco ---------- */
function catChips(){
 const chip=(id,label)=>`<button class="chip ${S.fcat===id?'on':''}" data-a="fcat" data-id="${id}">${esc(label)}</button>`;
 return `<div class="catbar">${chip('','Tutte')}${CATS.map(c=>chip(c.id,c.name)).join('')}</div>`;
}
function listRows(items){
 return items.length?items.map(c=>{const k=cat(c.cat);
   return `<button class="row" data-a="edit" data-id="${c.id}"><span class="dot" style="background:${k.color}"></span><span class="b"><b>${esc(c.title||'(senza titolo)')}</b><span class="meta">${esc(k.name)} · ${esc(c.meta||'')}</span></span><span class="lv">${esc(c.level)}</span></button>`;
  }).join(''):`<p class="empty">Nessuna scheda trovata.</p>`;
}
function listScreen(){
 const items=filtered();
 const countLabel=(S.q||S.fcat)?`${items.length} di ${CARDS.length} schede`:`${CARDS.length} schede`;
 return `<div class="screen">
  <div class="hero"><img src="${ICON_URI}" alt="" width="52"><p>Editor dei contenuti · ${countLabel}</p></div>
  <div class="bar"><input id="sq" placeholder="Cerca una scheda…" value="${esc(S.q)}">
   <button class="iconbtn solid" data-a="new" aria-label="Nuova scheda">${I.plus}</button></div>
  ${catChips()}
  <div class="list">${listRows(items)}</div>
  <div class="fabbar"><button class="btn ghost" data-a="export">${I.download}Esporta data.json</button><a class="btn ghost" href="${GITHUB_UPLOAD_URL}" target="_blank" rel="noopener noreferrer">${I.upload}GitHub</a></div>
 </div>`}

/* ---------- Schermata modifica ---------- */
function editScreen(){
 const c=CARDS.find(x=>x.id===S.editing);
 const k=cat(c.cat);
 return `<div class="screen">
  <div class="top"><button class="icon" data-a="back" aria-label="Indietro">${I.back}</button><div class="ttl"><b>${c.title?esc(c.title):'Nuova scheda'}</b><span>${esc(k.name)}</span></div><button class="icon" data-a="delete" aria-label="Elimina scheda">${I.trash}</button></div>
  <div class="form">
   <label class="lbl" for="f_title">Titolo</label>
   <input class="field" id="f_title" value="${esc(c.title)}" placeholder="Es. O-soto-gari" maxlength="70">

   <div class="row2">
    <div><label class="lbl" for="f_cat">Categoria</label>
     <select class="field" id="f_cat">${CATS.map(x=>`<option value="${x.id}" ${x.id===c.cat?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
    <div><label class="lbl" for="f_level">Livello</label>
     <select class="field" id="f_level">${LEVELS.map(l=>`<option ${l===c.level?'selected':''}>${l}</option>`).join('')}</select></div>
   </div>

   <label class="lbl" for="f_meta">Sottotitolo</label>
   <input class="field" id="f_meta" value="${esc(c.meta)}" placeholder="Es. Proiezione di gamba" maxlength="60">

   <label class="lbl" for="f_intro">Cos'è (2-4 frasi)</label>
   <textarea class="field" id="f_intro" placeholder="Spiegazione breve">${esc(c.intro)}</textarea>

   <label class="lbl" for="f_points">Punti chiave</label>
   <textarea class="field" id="f_points" placeholder="Un punto per riga">${esc((c.points||[]).join('\n'))}</textarea>
   <div class="hint">Una riga = un punto nell'elenco.</div>

   <label class="lbl" for="f_errors">Errori comuni</label>
   <textarea class="field" id="f_errors" placeholder="Un errore per riga">${esc((c.errors||[]).join('\n'))}</textarea>

   <label class="lbl" for="f_note">Nota (facoltativa)</label>
   <input class="field" id="f_note" value="${esc(c.note||'')}" placeholder="Es. Principio consolidato / Variante di scuola">

   <label class="lbl" for="f_video">Link video (facoltativo)</label>
   <input class="field" id="f_video" value="${esc(c.video||'')}" placeholder="https://…">

   <label class="lbl" for="f_relq">Schede collegate</label>
   <input class="field" id="f_relq" placeholder="Cerca una scheda da collegare…" autocomplete="off">
   <div class="chipset" id="rel-chips" style="margin-top:10px">${relChipsHtml(c,'')}</div>

   <div class="formactions">
    <button class="btn solid" data-a="save">${I.check}Salva scheda</button>
    <button class="btn ghost" data-a="duplicate">${I.copy}Duplica scheda</button>
   </div>
  </div>
 </div>`}

function sheet(){
 const s=S.sheet;if(!s)return'';
 let inner='';
 if(s==='howto'){
  inner=`<h3>Come aggiorno l'app pubblicata?</h3>
  <p>1. Hai già scaricato <b>data.json</b> (se non l'hai ancora fatto, torna indietro e tocca «Esporta data.json»).<br>
  2. Tocca qui sotto: si apre la pagina di GitHub per caricare i file nel repository.<br>
  3. Trascina o seleziona <b>data.json</b> (sovrascrive quello vecchio) → <b>Commit changes</b> in fondo alla pagina.<br>
  Dopo un minuto l'app pubblica mostra le modifiche, senza toccare nient'altro.</p>
  <div class="acts"><a class="btn solid" href="${GITHUB_UPLOAD_URL}" target="_blank" rel="noopener noreferrer">${I.upload}Apri GitHub per caricare i file</a><button class="btn ghost small" data-a="closesheet">Ho capito</button></div>`;
 }else if(s==='delete'){
  inner=`<h3>Eliminare questa scheda?</h3><p>Rimane nell'editor fino a quando non esporti di nuovo il file. Non tocca l'app già pubblicata finché non carichi il nuovo data.json.</p>
  <div class="acts"><button class="btn ghost danger" data-a="confirmdelete">Elimina</button><button class="btn ghost small" data-a="closesheet">Annulla</button></div>`;
 }
 return `<div class="sheetwrap"><div class="bg" data-a="closesheet"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${inner}</div></div>`}

function render(){
 $('#root').innerHTML=(S.screen==='list'?listScreen():editScreen())+sheet();
 const sq=$('#sq');if(sq){sq.focus();const v=sq.value;sq.value='';sq.value=v}
}

function readForm(c){
 c.title=$('#f_title').value.trim();
 c.cat=$('#f_cat').value; c.level=$('#f_level').value;
 c.meta=$('#f_meta').value.trim();
 c.intro=$('#f_intro').value.trim();
 c.points=$('#f_points').value.split('\n').map(s=>s.trim()).filter(Boolean);
 c.errors=$('#f_errors').value.split('\n').map(s=>s.trim()).filter(Boolean);
 c.note=$('#f_note').value.trim();
 c.video=$('#f_video').value.trim();
}

function exportData(){
 const clean=CARDS.map(({id,cat,level,title,meta,intro,points,errors,note,video,rel})=>({id,cat,level,title,meta,intro,points:points||[],errors:errors||[],note:note||'',video:video||'',rel:rel||[]}));
 const blob=new Blob([JSON.stringify({cards:clean},null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='data.json';
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),2000);
 toast('data.json scaricato');
 S.sheet='howto';render();
}

document.addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');if(!el)return;
 const a=el.dataset.a,d=el.dataset;
 if(a==='new'){
  const c={id:uniqueId('scheda'),cat:S.fcat||CATS[0].id,level:'Base',title:'',meta:'',intro:'',points:[],errors:[],note:'',video:'',rel:[]};
  CARDS.unshift(c);S.editing=c.id;S.screen='edit';S.dirty=true;render();$('#f_title')?.focus();
 }
 else if(a==='fcat'){S.fcat=d.id||null;render()}
 else if(a==='edit'){S.editing=d.id;S.screen='edit';render()}
 else if(a==='back'){
  const c=CARDS.find(x=>x.id===S.editing);
  if(c&&!c.title&&!c.intro&&!(c.points&&c.points.length))CARDS=CARDS.filter(x=>x.id!==c.id);
  S.screen='list';render();
 }
 else if(a==='save'){
  const c=CARDS.find(x=>x.id===S.editing);
  readForm(c);
  if(!c.title){$('#f_title').focus();return}
  const wanted=slug(c.title);
  if(c.id!==wanted&&!CARDS.some(x=>x.id!==c.id&&x.id===wanted))c.id=uniqueId(wanted);
  S.dirty=true;S.screen='list';render();toast('Scheda salvata (nell’editor)');
 }
 else if(a==='duplicate'){
  const c=CARDS.find(x=>x.id===S.editing);
  readForm(c);
  const copy=JSON.parse(JSON.stringify(c));
  copy.title=c.title?c.title+' (copia)':'';
  copy.id=uniqueId(slug(copy.title||'scheda'));
  CARDS.unshift(copy);S.editing=copy.id;S.dirty=true;render();toast('Scheda duplicata');
 }
 else if(a==='delete'){S.sheet='delete';render()}
 else if(a==='confirmdelete'){CARDS=CARDS.filter(x=>x.id!==S.editing);S.sheet=null;S.dirty=true;S.screen='list';render();toast('Scheda eliminata (nell’editor)')}
 else if(a==='rel'){
  const c=CARDS.find(x=>x.id===S.editing);c.rel=c.rel||[];
  const i=c.rel.indexOf(d.id);if(i>=0)c.rel.splice(i,1);else c.rel.push(d.id);
  S.dirty=true;
  const box=document.querySelector('#rel-chips');
  if(box)box.innerHTML=relChipsHtml(c,$('#f_relq')?.value||'');
 }
 else if(a==='export'){exportData()}
 else if(a==='howto'){S.sheet='howto';render()}
 else if(a==='closesheet'){S.sheet=null;render()}
});
document.addEventListener('input',e=>{
 if(e.target.id==='sq'){S.q=e.target.value;render()}
 else if(e.target.id==='f_relq'){
  const c=CARDS.find(x=>x.id===S.editing);
  const box=document.querySelector('#rel-chips');
  if(c&&box)box.innerHTML=relChipsHtml(c,e.target.value);
 }
});

render();

/* Carica i contenuti attualmente pubblicati, se disponibili, così l'editor
   riparte sempre da quello che è online adesso. Non sovrascrive se hai già
   iniziato a modificare qualcosa in questa sessione. */
(function loadRemoteData(){
 fetch('data.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{
  if(S.dirty)return;
  if(d&&Array.isArray(d.cards)&&d.cards.length){CARDS=d.cards;S.source='pubblicati';if(S.screen==='list')render()}
 }).catch(()=>{});
})();
</script>
</body>
</html>
